<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Delete Client</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page">
        <h1>Delete Client</h1>

        <nav>
            <a href="/web">Home</a> |
            <a href="/web/clients">Clients</a> |
            <a href="/web/deals">Deals</a> |
            <a href="/web/tasks">Tasks</a> |
            <a href="/web/stats">Stats</a> |
            <a href="/logout">Logout</a>
        </nav>

        <h2>Are you sure?</h2>

        <p>You are going to delete this client:</p>

        <table>
            <tr>
                <th>ID</th>
                <td>{{ client.id }}</td>
            </tr>
            <tr>
                <th>Name</th>
                <td>{{ client.name }}</td>
            </tr>
            <tr>
                <th>Phone</th>
                <td>{{ client.phone }}</td>
            </tr>
            <tr>
                <th>Email</th>
                <td>{{ client.email }}</td>
            </tr>
            <tr>
                <th>Company</th>
                <td>{{ client.company }}</td>
            </tr>
        </table>

        <form method="post" action="/web/clients/{{ client.id }}/delete">
            <button type="submit">Confirm delete</button>
        </form>

        <p>
            <a href="/web/clients">Cancel</a>
        </p>
    </div>
</body>
</html>
