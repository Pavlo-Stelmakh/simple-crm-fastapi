<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edit Deal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Edit Deal</h1>

    <form method="post" action="/web/deals/{{ deal.id }}/edit">
        <p>
            <select name="client_id" required>
                {% for client in clients %}
                    <option value="{{ client.id }}"
                        {% if client.id == deal.client_id %}selected{% endif %}>
                        {{ client.name }} — {{ client.company }}
                    </option>
                {% endfor %}
            </select>
        </p>

        <p>
            <input type="text" name="title" value="{{ deal.title }}" required>
        </p>

        <p>
            <input type="number" step="0.01" name="amount" value="{{ deal.amount }}">
        </p>

        <p>
            <select name="status">
                <option value="new" {% if deal.status == "new" %}selected{% endif %}>new</option>
                <option value="in_progress" {% if deal.status == "in_progress" %}selected{% endif %}>in_progress</option>
                <option value="won" {% if deal.status == "won" %}selected{% endif %}>won</option>
                <option value="lost" {% if deal.status == "lost" %}selected{% endif %}>lost</option>
            </select>
        </p>

        <p>
            <input type="text" name="comment" value="{{ deal.comment }}">
        </p>

        <button type="submit">Save</button>
    </form>

    <p>
        <a href="/web/deals">Back to deals</a>
    </p>
</body>
</html>
